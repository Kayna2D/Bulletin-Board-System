services:
  broker:          # REQ/REP (clientes <-> servidores)
    build: ./broker

  proxy:           # PUB/SUB (XSUB 5557 / XPUB 5558)
    build: ./proxy

  server-a:
    build: ./server
    environment: { SERVER_NAME: server-a }
    volumes: [ "./data/server-a:/data" ]
    depends_on: [ broker, proxy ]

  server-b:
    build: ./server
    environment: { SERVER_NAME: server-b }
    volumes: [ "./data/server-b:/data" ]
    depends_on: [ broker, proxy ]

  client-ana:
    build: ./client
    environment: { BOT_NAME: ana }
    depends_on: [ broker, proxy ]

  client-bob:
    build: ./client
    environment: { BOT_NAME: bob }
    depends_on: [ broker, proxy ]
